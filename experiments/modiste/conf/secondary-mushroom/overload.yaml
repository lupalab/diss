hydra:
  job:
    name: modiste-secondary-mushroom-overload
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

make_envs_func:
  _target_: envs.uci_health.secondary_mushroom.make_overload_components
  sig_mult: 0.15
  bias_level: 1.0
  min_temp: 1.0
  bias_mult: 5.0
# reward_est: TODO
# strat: TODO
train_conf:
  init_capital: 250
  n_iter: 4001
  eval_bsz: 500
  eval_every_n_iter: 250
  save_ckpt_every_n_iter: 1000
  init_capital_rseed: null
  to_eval_on_train: false
  to_log_additional_metrics: false
plf:
  _target_: lightning.Fabric
  accelerator: cpu
