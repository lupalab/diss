hydra:
  job:
    name: diab130-simplicity
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

make_envs_func:
  _target_: envs.uci_health.diabetes130.make_simplicity_components
  sig_mult: 0.15
  bias_level: 1.0
  poison_feature_idx: 25
  xgbc_kwargs:
    n_jobs: 1
# reward_est: TODO
# strat: TODO
train_conf:
  init_capital: 250
  n_iter: 8001
  eval_bsz: 500
  eval_every_n_iter: 250
  save_ckpt_every_n_iter: 1000
  init_capital_rseed: null
  to_eval_on_train: false
  to_log_additional_metrics: false
plf:
  _target_: lightning.Fabric
  accelerator: cpu
