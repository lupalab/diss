hydra:
  job:
    name: oai-klg-overload
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

make_envs_func:
  _target_: envs.colleague.oai.klg.make_overload_components
  sig_mult: 0.15
  bias_level: 1.0
  min_temp: 1.0
  bias_mult: 5.0
eval_bsz: 500
plf:
  _target_: lightning.Fabric
  accelerator: cpu
