hydra:
  job:
    name: oai-klg-simplicity
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

make_envs_func:
  _target_: envs.colleague.oai.klg.make_simplicity_components
  sig_mult: 0.15
  bias_level: 1.0
  poison_feature_idx: 17  # JSW_1 — radiographic joint space width (index 17 in OAI_ALL_FEATURE_NAMES)
  xgbc_kwargs:
    n_jobs: 1
eval_bsz: 500
plf:
  _target_: lightning.Fabric
  accelerator: cpu
